<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MType - Typing Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="stats">
            <div class="stat">
                <span class="stat-value" id="wpm">0</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="accuracy">100</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="time-words-value">60s</span>
            </div>
        </div>

        <div class="typing-area">
            <div class="text-display" id="text-display">
                <!-- Smooth typing cursor will be positioned here dynamically -->
                <span id="typing-cursor" class="typing-cursor"></span>
            </div>
        </div>

        <!-- Custom Smooth Cursor Element -->
        <div id="smooth-cursor" class="smooth-cursor"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
